name: backtest

on:
  pull_request:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Run backtest (momentum, synthetic panel)
        run: |
          uv run python scripts/backtest.py \
            --config configs/momentum.yaml \
            --out reports/backtest.json

      - name: Guard rails
        run: |
          uv run python - <<'EOF'
          import json
          report = json.load(open("reports/backtest.json"))
          print("Backtest summary:", report)
          assert report["n_days"] > 0, "empty backtest"
          assert report["max_drawdown"] > -1.0, "equity wiped out"
          EOF

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: reports/backtest.json
