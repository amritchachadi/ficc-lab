[project]
name = "rates-analytics"
version = "0.1.0"
description = "Fixed-income curve construction, bond analytics and rate risk, with explicit convention handling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "matplotlib>=3.8",
    "reportlab>=4.0",
]

[project.optional-dependencies]
# QuantLib is a cross-validation target, not a runtime dependency of the
# conventions layer. Tests that need it skip cleanly when it is absent.
quantlib = ["QuantLib>=1.34"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "QuantLib>=1.34",
    "pandas-stubs>=3.0.5.260914",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rates_analytics"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF", "ANN", "D"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "ANN201"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
# No python_version pin: each matrix job type-checks against its own
# interpreter. Pinning it makes mypy reject valid newer syntax in the
# installed third-party stubs.
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "QuantLib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yfinance.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
